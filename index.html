<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="安全密碼與資料管理 PWA，資料儲存在本地瀏覽器，支援離線使用。">
    <title>分享本本</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="分享本本">
    <meta name="theme-color" content="#0071e3">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="icon" href="favicon.ico">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>

    <!-- App assets (app.js MUST load before Alpine.js so alpine:init listener is registered) -->
    <link rel="stylesheet" href="styles.css">
    <!-- Keep the original app logic: this file still expects the existing app.js and styles.css alongside it. -->
    <script src="app.js"></script>

    <!-- J.Law Synthesis Lab-inspired, mobile-first presentation -->
    <style>
      :root {
        color-scheme: light;
        --lab-bg: #fbfbfd;
        --lab-surface: #ffffff;
        --lab-text: #1d1d1f;
        --lab-muted: #86868b;
        --lab-border: #d2d2d7;
        --lab-blue: #0071e3;
        --lab-blue-soft: #eaf3ff;
        --lab-radius: 18px;
      }
      [x-cloak] { display: none !important; }
      html { background: var(--lab-bg); -webkit-text-size-adjust: 100%; }
      body {
        margin: 0; background: var(--lab-bg) !important; color: var(--lab-text) !important;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      button, input, textarea { font: inherit; }
      button, label[for] { touch-action: manipulation; }
      button { min-height: 42px; }
      input, textarea {
        font-size: 16px !important; /* prevents iOS Safari zooming into fields */
        border-color: var(--lab-border) !important;
        border-radius: 13px !important;
        box-shadow: none !important;
      }
      input:focus, textarea:focus {
        outline: none !important; border-color: var(--lab-blue) !important;
        box-shadow: 0 0 0 3px rgba(0,113,227,.12) !important;
      }
      #app-header {
        background: rgba(251,251,253,.92) !important;
        border-color: rgba(210,210,215,.78) !important;
        box-shadow: 0 1px 0 rgba(0,0,0,.025) !important;
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
      }
      #app-header > div { max-width: 760px; padding-left: 16px; padding-right: 16px; }
      #app-header h1 { color: var(--lab-text) !important; letter-spacing: -.035em; }
      #app-header p { color: var(--lab-muted) !important; }
      #app-header .bg-blue-600 {
        background: var(--lab-text) !important; border-radius: 15px !important;
        box-shadow: none !important;
      }
      #app-header button, #app-header label {
        min-height: 42px; border-radius: 12px !important;
        border-color: var(--lab-border) !important; box-shadow: none !important;
      }
      #app-header input { background: #fff !important; }
      #main-content { max-width: 760px; }
      #main-content > .bg-white,
      #main-content > div.bg-white {
        border-color: rgba(210,210,215,.8) !important;
        border-radius: var(--lab-radius) !important;
        box-shadow: 0 3px 16px rgba(29,29,31,.035) !important;
      }
      #main-content ul > li { transition: background-color .15s ease; }
      #main-content h3 { color: var(--lab-text) !important; letter-spacing: -.015em; }
      #main-content .bg-blue-50, #main-content .bg-blue-100 {
        background: var(--lab-blue-soft) !important;
      }
      #main-content .text-blue-600 { color: var(--lab-blue) !important; }
      #main-content button { min-width: 42px; min-height: 42px; }
      .fab {
        position: fixed; z-index: 40; right: 20px;
        bottom: max(20px, calc(env(safe-area-inset-bottom) + 14px));
        width: 58px; height: 58px; min-height: 58px; border: 0;
        border-radius: 20px; display: flex; align-items: center; justify-content: center;
        background: var(--lab-blue); color: #fff; font-size: 25px;
        box-shadow: 0 8px 24px rgba(0,113,227,.24);
        transition: transform .15s ease, background .15s ease;
      }
      .fab:active { transform: scale(.96); background: #0062c4; }
      .modal-panel {
        border-radius: 24px !important; border: 1px solid rgba(210,210,215,.65);
        box-shadow: 0 20px 70px rgba(0,0,0,.18) !important;
      }
      .modal-panel form > div:last-child { background: #f5f5f7 !important; }
      .modal-panel button[type="submit"] {
        background: var(--lab-blue) !important; border-radius: 12px !important;
        box-shadow: none !important; min-height: 46px;
      }
      .modal-panel button[type="button"] { border-radius: 12px !important; min-height: 46px; }
      .toast-item {
        border: 1px solid rgba(210,210,215,.35) !important;
        border-radius: 15px !important; box-shadow: 0 8px 30px rgba(0,0,0,.15) !important;
      }
      @media (max-width: 639px) {
        #app-header > div { padding-left: 14px; padding-right: 14px; padding-bottom: 12px; }
        #app-header > div > div:first-child { gap: 10px; }
        #app-header .flex.flex-col.sm\\:flex-row {
          gap: 10px !important;
        }
        #app-header .flex.flex-wrap.gap-2 {
          display: grid !important; grid-template-columns: 1fr 1fr; gap: 8px !important;
        }
        #app-header .flex.flex-wrap.gap-2 > button,
        #app-header .flex.flex-wrap.gap-2 > label {
          width: 100%; padding: 9px 8px !important; font-size: 12px !important;
        }
        #app-header .flex.flex-wrap.gap-2 > button:last-of-type {
          grid-column: 1 / -1;
        }
        #app-header .relative.mt-3 { margin-top: 10px !important; }
        #app-header input { padding-top: 11px !important; padding-bottom: 11px !important; }
        #main-content { padding-left: 12px !important; padding-right: 12px !important; }
        #main-content > div.mb-4 { margin-bottom: 10px; }
        #main-content .overflow-hidden.mb-16 { margin-bottom: 90px; }
        #main-content ul > li { padding: 15px 13px !important; }
        #main-content .pl-11 { padding-left: 0 !important; }
        #main-content .pl-11 .text-xs { font-size: 12px !important; }
        #main-content .pl-11 .w-12 { width: 42px !important; }
        #main-content .pwd-mono { max-width: calc(100vw - 142px); }
        .modal-panel { width: calc(100vw - 20px) !important; max-width: 520px; }
        .modal-panel form > div:first-child { padding: 20px 16px 16px !important; }
        .modal-panel form > div:first-child > div > div:first-child { display: none; }
        .modal-panel form > div:first-child > div > div:last-child { margin: 0 !important; text-align: left !important; }
        .modal-panel #modal-title { font-size: 20px; letter-spacing: -.03em; }
        .modal-panel form > div:last-child { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)) !important; }
        .modal-panel form > div:last-child button { width: 100%; margin: 0 !important; }
        .modal-panel form > div:last-child { display: flex; flex-direction: column; gap: 8px; }
        .fixed.bottom-4.right-4 { right: 12px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
      }
    </style>

</head>
<body class="bg-[#fbfbfd] text-[#1d1d1f] font-sans antialiased min-h-screen" x-data="passwordManager()" x-cloak>

    <!-- ============ FIXED HEADER (title + buttons + search, all pinned together) ============ -->
    <header id="app-header" class="fixed top-0 left-0 right-0 z-30 bg-slate-50/95 backdrop-blur-md border-b border-slate-200 shadow-xs" style="padding-top:max(0.75rem,env(safe-area-inset-top))">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pb-3">
            <!-- Row 1: logo + title + buttons -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-200 shrink-0">
                        <i class="ph ph-shield-check text-2xl sm:text-3xl"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">分享本本</h1>
                        <p class="text-xs sm:text-sm text-slate-500">安全密碼與資料管理（PWA 離線支援）</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                    <button @click="exportToJson()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-3.5 py-2 rounded-lg font-medium text-sm transition-colors shadow-sm">
                        <i class="ph ph-file-js text-lg"></i><span>匯出 JSON</span>
                    </button>
                    <label class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-3.5 py-2 rounded-lg font-medium text-sm transition-colors shadow-sm cursor-pointer">
                        <i class="ph ph-upload-simple text-lg"></i><span>匯入 JSON</span>
                        <input type="file" accept=".json,application/json" class="hidden" @change="importFromJson($event)">
                    </label>
                    <button @click="exportToHtml()" class="flex-none flex items-center justify-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-3.5 py-2 rounded-lg font-medium text-sm transition-colors shadow-sm" title="匯出 HTML">
                        <i class="ph ph-download-simple text-lg"></i><span>匯出 HTML</span>
                    </button>
                </div>
            </div>

            <!-- Row 2: search bar -->
            <div class="relative mt-3">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                    <i class="ph ph-magnifying-glass text-slate-400 text-lg"></i>
                </div>
                <input type="text" x-model="searchQuery" placeholder="搜尋網站、帳號或備忘錄..." class="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white shadow-sm text-sm sm:text-base">
            </div>
        </div>
    </header>

    <!-- ============ MAIN CONTENT (padding-top set dynamically by JS) ============ -->
    <main class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8" id="main-content" style="padding-top:160px">
        <!-- Stats -->
        <div class="mb-4 text-xs sm:text-sm text-slate-500 flex justify-between items-center px-1">
            <span>共 <span class="font-semibold text-slate-700" x-text="filteredPasswords.length"></span> 筆項目</span>
            <span x-show="searchQuery" class="text-blue-600">（搜尋過濾中）</span>
        </div>

        <!-- Empty -->
        <div x-show="filteredPasswords.length === 0" class="text-center p-12 bg-white rounded-2xl border border-slate-200 shadow-sm my-6">
            <i class="ph ph-lock-key text-5xl text-slate-300 mb-3"></i>
            <p class="text-slate-500 text-sm" x-text="searchQuery ? '找不到符合的項目' : '尚無密碼資料，請點擊右下角 + 新增或匯入 JSON'"></p>
        </div>

        <!-- List -->
        <div x-show="filteredPasswords.length > 0" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-16">
            <ul class="divide-y divide-slate-100">
                <template x-for="item in filteredPasswords" :key="item.id">
                    <li class="p-4 sm:p-5 hover:bg-slate-50/80 transition-colors group">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2.5 mb-2">
                                    <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-sm shrink-0 shadow-inner">
                                        <span x-text="(item.siteName || '?').charAt(0).toUpperCase()"></span>
                                    </div>
                                    <h3 class="text-base font-semibold text-slate-900 truncate" x-text="item.siteName"></h3>
                                    <a x-show="item.url" :href="item.url.startsWith('http') ? item.url : 'https://' + item.url" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-blue-600 transition-colors p-1" title="開啟網站">
                                        <i class="ph ph-link text-base"></i>
                                    </a>
                                </div>
                                <div class="pl-11 space-y-1.5">
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs sm:text-sm font-medium text-slate-400 w-12 shrink-0">帳號:</span>
                                        <span class="text-xs sm:text-sm text-slate-700 truncate select-all font-mono min-w-0" x-text="item.username"></span>
                                        <button @click="copyToClipboard(item.username, '帳號已複製')" class="text-slate-300 hover:text-blue-600 p-1.5 rounded hover:bg-blue-50 transition-colors shrink-0" title="複製帳號">
                                            <i class="ph ph-copy text-sm"></i>
                                        </button>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs sm:text-sm font-medium text-slate-400 w-12 shrink-0">密碼:</span>
                                        <span class="text-xs sm:text-sm text-slate-800 font-mono select-all bg-slate-100/70 px-2 py-0.5 rounded pwd-mono truncate min-w-0" x-text="item.password"></span>
                                        <button @click="copyToClipboard(item.password, '密碼已複製')" class="text-slate-300 hover:text-blue-600 p-1.5 rounded hover:bg-blue-50 transition-colors shrink-0" title="複製密碼">
                                            <i class="ph ph-copy text-sm"></i>
                                        </button>
                                    </div>
                                    <div x-show="item.notes" class="mt-2 text-xs text-slate-500 bg-slate-50 p-2.5 rounded-lg border border-slate-100 whitespace-pre-wrap leading-relaxed">
                                        <i class="ph ph-note-pencil mr-1 text-blue-500"></i> <span x-text="item.notes"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-1.5 pl-11 sm:pl-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 justify-end">
                                <button @click="editItem(item)" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="編輯">
                                    <i class="ph ph-pencil-simple text-lg"></i>
                                </button>
                                <button @click="deleteItem(item.id)" class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="刪除">
                                    <i class="ph ph-trash text-lg"></i>
                                </button>
                            </div>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </main>

    <!-- Floating "+" button -->
    <button type="button" class="fab" @click.prevent.stop="openModal()" title="新增項目" aria-label="新增項目">
        <i class="ph ph-plus"></i>
    </button>

    <!-- Modal -->
    <div x-show="isModalOpen" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true" style="display:none">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="isModalOpen" x-transition.opacity class="fixed inset-0 bg-slate-900 bg-opacity-50 backdrop-blur-xs transition-opacity" @click="closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div x-show="isModalOpen" x-transition class="modal-panel inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <form @submit.prevent="saveItem">
                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 sm:mx-0 sm:h-10 sm:w-10">
                                <i class="ph text-blue-600 text-xl" :class="editingId ? 'ph-pencil-simple' : 'ph-plus'"></i>
                            </div>
                            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                                <h3 class="text-lg leading-6 font-medium text-slate-900" id="modal-title" x-text="editingId ? '編輯項目' : '新增密碼項目'"></h3>
                                <div class="mt-4 space-y-3.5">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">網站/服務名稱 <span class="text-red-500">*</span></label>
                                        <input type="text" x-model="formData.siteName" required class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">網址 (選填)</label>
                                        <input type="text" x-model="formData.url" placeholder="ex: example.com" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">帳號/使用者名稱 <span class="text-red-500">*</span></label>
                                        <input type="text" x-model="formData.username" required class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">密碼 <span class="text-red-500">*</span></label>
                                        <div class="relative">
                                            <input :type="showPasswordInModal ? 'text' : 'password'" x-model="formData.password" required class="w-full border border-slate-300 rounded-lg px-3.5 py-2 pr-10 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <button type="button" @click="showPasswordInModal = !showPasswordInModal" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                                <i class="ph text-lg" :class="showPasswordInModal ? 'ph-eye-slash' : 'ph-eye'"></i>
                                            </button>
                                        </div>
                                        <div class="mt-2">
                                            <button type="button" @click="generatePassword" class="text-xs text-blue-600 hover:text-blue-800 flex items-center gap-1 font-medium">
                                                <i class="ph ph-magic-wand text-sm"></i> 產生安全隨機密碼
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">備忘錄 (選填)</label>
                                        <textarea x-model="formData.notes" rows="2" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse rounded-b-2xl gap-2">
                        <button type="submit" class="w-full sm:w-auto inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">儲存</button>
                        <button type="button" @click="closeModal()" class="mt-3 sm:mt-0 w-full sm:w-auto inline-flex justify-center rounded-lg border border-slate-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none" style="bottom:max(1rem,calc(env(safe-area-inset-bottom) + 1rem))">
        <template x-for="toast in toasts" :key="toast.id">
            <div class="toast-item bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 min-w-[220px] pointer-events-auto border border-slate-800">
                <i class="ph text-xl shrink-0" :class="toast.type === 'success' ? 'ph-check-circle text-emerald-400' : (toast.type === 'error' ? 'ph-warning-circle text-rose-400' : 'ph-info text-sky-400')"></i>
                <span x-text="toast.message" class="text-sm font-medium"></span>
            </div>
        </template>
    </div>

</body>
</html>
