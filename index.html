<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="安全密碼與資料管理 PWA，資料儲存在本地瀏覽器，支援離線使用。">
    <title>分享本本</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="分享本本">
    <meta name="theme-color" content="#f7f5f0">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="icon" href="favicon.ico">

    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
    <script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="passwordManager()" x-cloak>

    <!-- ═══════════ LOCK SCREEN ═══════════ -->
    <div x-show="!unlocked" class="lock-screen">
        <div class="lock-card">
            <div class="lock-brand">
                <img src="icons/apple-touch-icon.png" alt="Kumamon" class="lock-logo">
                <h1>分享本本</h1>
                <p x-text="lockMode === 'setup' ? '首次使用，請設定主密碼' : '請輸入主密碼以解鎖'"></p>
            </div>

            <form @submit.prevent="submitLock" class="lock-form">
                <div class="field-wrap">
                    <input
                        :type="showMasterPwd ? 'text' : 'password'"
                        x-model="masterInput"
                        :placeholder="lockMode === 'setup' ? '設定主密碼（至少 4 字）' : '主密碼'"
                        autocomplete="current-password"
                        class="input"
                        :disabled="lockBusy"
                    >
                    <button type="button" class="eye-btn" @click="showMasterPwd = !showMasterPwd" aria-label="顯示密碼">
                        <svg x-show="!showMasterPwd" width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M247.31 124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57 61.26 162.88 48 128 48S61.43 61.26 36.34 86.35C17.51 105.18 9 124 8.69 124.76a8 8 0 0 0 0 6.48c.35.79 8.82 19.58 27.65 38.41C61.43 194.74 93.12 208 128 208s66.57-13.26 91.66-38.35c18.83-18.83 27.3-37.62 27.65-38.41a8 8 0 0 0 0-6.48ZM128 192c-30.78 0-57.67-11.19-79.93-33.25A133.47 133.47 0 0 1 25 128a133.33 133.33 0 0 1 23.07-30.75C70.33 75.19 97.22 64 128 64s57.67 11.19 79.93 33.25A133.46 133.46 0 0 1 231.05 128c-7.21 13.46-38.62 64-103.05 64Zm0-112a48 48 0 1 0 48 48 48.05 48.05 0 0 0-48-48Zm0 80a32 32 0 1 1 32-32 32 32 0 0 1-32 32Z"/></svg>
                        <svg x-show="showMasterPwd" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" style="display:none"><path d="M53.92 34.62a8 8 0 1 0-11.84 10.76l19.24 21.17C25 88.84 9.38 111.76 8.69 124.76a8 8 0 0 0 0 6.48c.35.79 8.82 19.58 27.65 38.41C61.43 194.74 93.12 208 128 208a127.11 127.11 0 0 0 52.07-10.83l22 24.21a8 8 0 1 0 11.84-10.76Zm47.32 115.84 41.67 45.85A112 112 0 0 1 128 192c-30.78 0-57.67-11.19-79.93-33.25A133.16 133.16 0 0 1 25 128c4.69-8.79 19.66-33.39 45.65-49.6l24.68 27.15a48.06 48.06 0 0 0 5.91 44.91Zm-16-32.87 24.15 26.57A32 32 0 0 1 85.24 117.59ZM247.31 124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57 61.26 162.88 48 128 48c-12.88 0-25 1.91-36.33 5.34l17.57 19.32A112.14 112.14 0 0 1 128 64c30.78 0 57.67 11.19 79.93 33.25A133.47 133.47 0 0 1 231.05 128a144.68 144.68 0 0 1-19.15 28.66l13.55 14.9C241.5 154 249.86 135.4 247.31 124.76Z"/></svg>
                    </button>
                </div>

                <div x-show="lockMode === 'setup'">
                    <input
                        :type="showMasterPwd ? 'text' : 'password'"
                        x-model="masterConfirm"
                        placeholder="再次確認主密碼"
                        autocomplete="new-password"
                        class="input"
                        :disabled="lockBusy"
                    >
                </div>

                <p x-show="lockError" class="lock-error" x-text="lockError"></p>

                <button type="submit" class="btn-primary" :disabled="lockBusy">
                    <span x-show="!lockBusy" x-text="lockMode === 'setup' ? '設定並開始使用' : '解鎖'"></span>
                    <span x-show="lockBusy">處理中…</span>
                </button>
            </form>

            <p class="lock-hint">
                資料以 AES 加密儲存在本機瀏覽器。<br>
                主密碼遺失將無法還原，請妥善保管。
            </p>
        </div>
    </div>

    <!-- ═══════════ APP ═══════════ -->
    <div x-show="unlocked" x-cloak>

    <header id="app-header">
        <div class="header-inner">
            <div class="header-top">
                <div class="brand">
                    <img src="icons/apple-touch-icon.png" alt="Kumamon" class="brand-logo">
                    <div>
                        <h1>分享本本</h1>
                        <p>安全密碼與資料管理 · 離線 PWA</p>
                    </div>
                </div>
                <div class="hdr-actions">
                    <button type="button" class="hdr-btn" @click="exportToJson()">
                        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M213.66 82.34l-56-56A8 8 0 0 0 152 24H56a16 16 0 0 0-16 16v176a16 16 0 0 0 16 16h144a16 16 0 0 0 16-16V88a8 8 0 0 0-2.34-5.66ZM160 51.31 188.69 80H160ZM200 216H56V40h88v48a8 8 0 0 0 8 8h48zm-42.34-61.66a8 8 0 0 1 0 11.32l-24 24a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L120 164.69V120a8 8 0 0 1 16 0v44.69l10.34-10.35a8 8 0 0 1 11.32 0Z"/></svg>
                        <span>匯出 JSON</span>
                    </button>
                    <label class="hdr-btn">
                        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M224 152v56a16 16 0 0 1-16 16H48a16 16 0 0 1-16-16v-56a8 8 0 0 1 16 0v56h160v-56a8 8 0 0 1 16 0ZM93.66 86.34a8 8 0 0 1 0-11.32l32-32a8 8 0 0 1 11.32 0l32 32a8 8 0 0 1-11.32 11.32L136 67.31V152a8 8 0 0 1-16 0V67.31l-21.66 21.65a8 8 0 0 1-11.32 0Z"/></svg>
                        <span>匯入 JSON</span>
                        <input type="file" accept=".json,application/json" class="hidden" @change="importFromJson($event)">
                    </label>
                    <button type="button" class="hdr-btn" @click="exportToHtml()">
                        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M224 144v64a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8v-64a8 8 0 0 1 16 0v56h160v-56a8 8 0 0 1 16 0Zm-101.66 5.66a8 8 0 0 0 11.32 0l40-40a8 8 0 0 0-11.32-11.32L136 124.69V32a8 8 0 0 0-16 0v92.69L93.66 98.34a8 8 0 0 0-11.32 11.32Z"/></svg>
                        <span>匯出 HTML</span>
                    </button>
                    <button type="button" class="hdr-btn" @click="lockNow()" title="立即鎖定">
                        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M208 80h-32V56a48 48 0 0 0-96 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16ZM96 56a32 32 0 0 1 64 0v24H96Zm112 152H48V96h160z"/></svg>
                        <span>鎖定</span>
                    </button>
                </div>
            </div>
            <div class="search-wrap">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M229.66 218.34l-50.07-50.06a88.11 88.11 0 1 0-11.31 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32ZM40 112a72 72 0 1 1 72 72 72.08 72.08 0 0 1-72-72Z"/></svg>
                <input type="text" x-model="searchQuery" placeholder="搜尋網站、帳號或備忘錄..." class="search-input">
            </div>
        </div>
    </header>

    <main id="main-content">
        <div class="stats">
            <div class="stat-card">
                <p class="stat-label">項目總數</p>
                <p class="stat-value" x-text="passwords.length"></p>
            </div>
            <div class="stat-card">
                <p class="stat-label">目前顯示</p>
                <p class="stat-value">
                    <span x-text="filteredPasswords.length"></span>
                    <span x-show="searchQuery" class="stat-hint">（搜尋中）</span>
                </p>
            </div>
        </div>

        <div x-show="filteredPasswords.length === 0" class="empty-card">
            <img src="icons/apple-touch-icon.png" alt="" class="empty-logo">
            <p x-text="searchQuery ? '找不到符合的項目' : '尚無資料，點右下角 + 新增或匯入 JSON'"></p>
        </div>

        <div x-show="filteredPasswords.length > 0" class="list-card">
            <ul>
                <template x-for="item in filteredPasswords" :key="item.id">
                    <li class="list-row">
                        <div class="row-head">
                            <div class="row-title">
                                <div class="avatar">
                                    <span x-text="(item.siteName || '?').charAt(0).toUpperCase()"></span>
                                </div>
                                <div class="title-text">
                                    <h3 x-text="item.siteName"></h3>
                                    <a x-show="item.url"
                                       :href="item.url.startsWith('http') ? item.url : 'https://' + item.url"
                                       target="_blank" rel="noopener noreferrer"
                                       class="link-btn" title="開啟網站">
                                        <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M224 104a8 8 0 0 1-16 0V59.32l-66.33 66.34a8 8 0 0 1-11.32-11.32L196.68 48H152a8 8 0 0 1 0-16h64a8 8 0 0 1 8 8Zm-40 24a8 8 0 0 0-8 8v72H48V80h72a8 8 0 0 0 0-16H48a16 16 0 0 0-16 16v128a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16v-72a8 8 0 0 0-8-8Z"/></svg>
                                    </a>
                                </div>
                            </div>
                            <div class="row-actions">
                                <button type="button" class="icon-btn" @click="editItem(item)" title="編輯">
                                    <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M227.31 73.37 182.63 28.69a16 16 0 0 0-22.63 0L36.69 152A15.86 15.86 0 0 0 32 163.31V208a16 16 0 0 0 16 16h44.69a15.86 15.86 0 0 0 11.31-4.69L227.31 96a16 16 0 0 0 0-22.63ZM51.31 160 136 75.31 152.69 92 68 176.68ZM48 179.31 76.69 208H48Zm48 25.38L79.31 188 164 103.31 180.69 120Zm96-96L147.31 64l24-24L216 84.69Z"/></svg>
                                </button>
                                <button type="button" class="icon-btn danger" @click="deleteItem(item.id)" title="刪除">
                                    <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M216 48h-40v-8a24 24 0 0 0-24-24h-48a24 24 0 0 0-24 24v8H40a8 8 0 0 0 0 16h8v144a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16V64h8a8 8 0 0 0 0-16ZM96 40a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v8H96Zm96 168H64V64h128Zm-80-104v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0Zm48 0v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0Z"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="row-body">
                            <div class="field-line">
                                <span class="field-label">帳號</span>
                                <span class="field-value mono" x-text="item.username"></span>
                                <button type="button" class="icon-btn sm" @click="copyToClipboard(item.username, '帳號已複製')" title="複製帳號">
                                    <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8Zm-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></svg>
                                </button>
                            </div>
                            <div class="field-line">
                                <span class="field-label">密碼</span>
                                <span class="pwd-chip" x-text="item.password"></span>
                                <button type="button" class="icon-btn sm" @click="copyToClipboard(item.password, '密碼已複製')" title="複製密碼">
                                    <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8Zm-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></svg>
                                </button>
                            </div>
                            <div x-show="item.notes" class="note-line-wrap">
                                <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" class="note-icon"><path d="M168 128a8 8 0 0 1-8 8H96a8 8 0 0 1 0-16h64a8 8 0 0 1 8 8Zm-8 24H96a8 8 0 0 0 0 16h64a8 8 0 0 0 0-16ZM216 40v176a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V40a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16Zm-16 0H56v176h144Z"/></svg>
                                <button type="button"
                                    class="note-line"
                                    :class="{ 'expanded': item._noteOpen }"
                                    @click="item._noteOpen = !item._noteOpen"
                                    :title="item._noteOpen ? '點擊收合' : '點擊展開'"
                                    x-text="item.notes"></button>
                            </div>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </main>

    <button type="button" class="fab" @click.prevent.stop="openModal()" title="新增項目" aria-label="新增項目">
        <svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor"><path d="M224 128a8 8 0 0 1-8 8h-80v80a8 8 0 0 1-16 0v-80H40a8 8 0 0 1 0-16h80V40a8 8 0 0 1 16 0v80h80a8 8 0 0 1 8 8Z"/></svg>
    </button>

    <!-- Modal -->
    <div x-show="isModalOpen" class="modal-root" role="dialog" aria-modal="true" style="display:none">
        <div class="modal-backdrop" @click="closeModal()" x-show="isModalOpen" x-transition.opacity></div>
        <div class="modal-panel" x-show="isModalOpen" x-transition>
            <form @submit.prevent="saveItem">
                <div class="modal-body">
                    <div class="modal-title-row">
                        <img src="icons/apple-touch-icon.png" alt="" class="modal-logo">
                        <h3 x-text="editingId ? '編輯項目' : '新增密碼項目'"></h3>
                    </div>
                    <div class="form-fields">
                        <div>
                            <label>網站/服務名稱 <span class="req">*</span></label>
                            <input type="text" x-model="formData.siteName" required class="input">
                        </div>
                        <div>
                            <label>網址 (選填)</label>
                            <input type="text" x-model="formData.url" placeholder="ex: example.com" class="input">
                        </div>
                        <div>
                            <label>帳號/使用者名稱 <span class="req">*</span></label>
                            <input type="text" x-model="formData.username" required class="input">
                        </div>
                        <div>
                            <label>密碼 <span class="req">*</span></label>
                            <div class="field-wrap">
                                <input :type="showPasswordInModal ? 'text' : 'password'" x-model="formData.password" required class="input pr-10 mono">
                                <button type="button" class="eye-btn" @click="showPasswordInModal = !showPasswordInModal">
                                    <svg x-show="!showPasswordInModal" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M247.31 124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57 61.26 162.88 48 128 48S61.43 61.26 36.34 86.35C17.51 105.18 9 124 8.69 124.76a8 8 0 0 0 0 6.48c.35.79 8.82 19.58 27.65 38.41C61.43 194.74 93.12 208 128 208s66.57-13.26 91.66-38.35c18.83-18.83 27.3-37.62 27.65-38.41a8 8 0 0 0 0-6.48ZM128 192c-30.78 0-57.67-11.19-79.93-33.25A133.47 133.47 0 0 1 25 128a133.33 133.33 0 0 1 23.07-30.75C70.33 75.19 97.22 64 128 64s57.67 11.19 79.93 33.25A133.46 133.46 0 0 1 231.05 128c-7.21 13.46-38.62 64-103.05 64Zm0-112a48 48 0 1 0 48 48 48.05 48.05 0 0 0-48-48Zm0 80a32 32 0 1 1 32-32 32 32 0 0 1-32 32Z"/></svg>
                                    <svg x-show="showPasswordInModal" width="18" height="18" viewBox="0 0 256 256" fill="currentColor" style="display:none"><path d="M53.92 34.62a8 8 0 1 0-11.84 10.76l19.24 21.17C25 88.84 9.38 111.76 8.69 124.76a8 8 0 0 0 0 6.48c.35.79 8.82 19.58 27.65 38.41C61.43 194.74 93.12 208 128 208a127.11 127.11 0 0 0 52.07-10.83l22 24.21a8 8 0 1 0 11.84-10.76Zm47.32 115.84 41.67 45.85A112 112 0 0 1 128 192c-30.78 0-57.67-11.19-79.93-33.25A133.16 133.16 0 0 1 25 128c4.69-8.79 19.66-33.39 45.65-49.6l24.68 27.15a48.06 48.06 0 0 0 5.91 44.91Zm-16-32.87 24.15 26.57A32 32 0 0 1 85.24 117.59ZM247.31 124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57 61.26 162.88 48 128 48c-12.88 0-25 1.91-36.33 5.34l17.57 19.32A112.14 112.14 0 0 1 128 64c30.78 0 57.67 11.19 79.93 33.25A133.47 133.47 0 0 1 231.05 128a144.68 144.68 0 0 1-19.15 28.66l13.55 14.9C241.5 154 249.86 135.4 247.31 124.76Z"/></svg>
                                </button>
                            </div>
                            <button type="button" class="gen-pwd" @click="generatePassword">
                                <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M48 64a8 8 0 0 1 8-8h64a8 8 0 0 1 0 16H56a8 8 0 0 1-8-8Zm8 40h64a8 8 0 0 0 0-16H56a8 8 0 0 0 0 16Zm128 48H56a8 8 0 0 0 0 16h128a8 8 0 0 0 0-16Zm0 32H56a8 8 0 0 0 0 16h128a8 8 0 0 0 0-16ZM147.31 36.68l-8 24a8 8 0 0 0 4.95 9.9 8.17 8.17 0 0 0 2.47.4 8 8 0 0 0 7.43-5.12l8-24a8 8 0 1 0-15.22-5.18ZM216 80a8 8 0 0 0-8 8v11.22l-11.22-11.22a8 8 0 0 0-11.32 11.32l11.23 11.22H185.48l11.22-11.22a8 8 0 0 0-11.32-11.32L174.16 99.22V88a8 8 0 0 0-16 0v32a8 8 0 0 0 8 8h32a8 8 0 0 0 0-16h-11.22l11.22-11.22V88a8 8 0 0 0-8-8Z"/></svg>
                                產生安全隨機密碼
                            </button>
                        </div>
                        <div>
                            <label>備忘錄 (選填)</label>
                            <textarea x-model="formData.notes" rows="2" class="input" placeholder="簡短備註即可"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn-primary">儲存</button>
                    <button type="button" class="btn-secondary" @click="closeModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    </div><!-- /unlocked -->

    <div class="toasts">
        <template x-for="toast in toasts" :key="toast.id">
            <div class="toast-item">
                <svg x-show="toast.type === 'success'" width="20" height="20" viewBox="0 0 256 256" fill="#34d399"><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24Zm45.66 85.66-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 11.32Z"/></svg>
                <svg x-show="toast.type === 'error'" width="20" height="20" viewBox="0 0 256 256" fill="#fb7185" style="display:none"><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24Zm-8 56a8 8 0 0 1 16 0v56a8 8 0 0 1-16 0Zm8 104a12 12 0 1 1 12-12 12 12 0 0 1-12 12Z"/></svg>
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

</body>
</html>
